<h2 mat-dialog-title>
  <mat-icon class="title-icon">security</mat-icon>
  Gerenciar Permissões
</h2>

<mat-dialog-content>
  <p class="subtitle">
    Defina as permissões para o colaborador
    <strong>{{ data.person.name }}</strong>
    na loja
    <strong>{{ data.store.tradeName || data.store.name }}</strong>.
  </p>

  @if (loading) {
    <div class="loading-state">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Carregando permissões do colaborador...</p>
    </div>
  } @else {
    <div class="dialog-selector-wrapper">
      <app-authorizations-selector
        [selectedAuths]="selectedAuths"
        [otherEmployees]="otherEmployees"
        [person]="data.person"
        [showCopyBar]="true"
        [showPresetsBar]="true"
        (authorizationsChange)="onAuthsChanged($event)"
      ></app-authorizations-selector>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()" [disabled]="saving">Cancelar</button>
  @if (saving) {
    <button mat-raised-button color="primary" disabled>
      <mat-spinner diameter="20" class="btn-spinner"></mat-spinner>
      <span>Salvando...</span>
    </button>
  } @else {
    <button mat-raised-button color="primary" (click)="save()" [disabled]="loading">
      <mat-icon>save</mat-icon>
      <span>Salvar</span>
    </button>
  }
</mat-dialog-actions>
