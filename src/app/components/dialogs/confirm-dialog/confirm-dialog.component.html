<div class="confirm-dialog-container" [ngClass]="data.type || 'primary'">
  @if (data.icon) {
    <div class="dialog-header">
      <div class="icon-circle">
        <mat-icon>{{ data.icon }}</mat-icon>
      </div>
    </div>
  }

  <h2 mat-dialog-title>{{ data.title }}</h2>

  <mat-dialog-content>
    <div [innerHTML]="data.message"></div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    @if (data.cancelText) {
      <button mat-button mat-dialog-close class="cancel-btn">
        {{ data.cancelText }}
      </button>
    }
    <button mat-flat-button [mat-dialog-close]="true" class="confirm-btn">
      {{ data.confirmText }}
    </button>
  </mat-dialog-actions>
</div>
